<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurants4U</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17181A;
    --surface: #1F2022;
    --border: #35342F;
    --text-primary: #F3EFE6;
    --text-muted: #A69C8D;
    --accent: #E4A93A;
    --accent-2: #7A9471;
    --danger: #D9724C;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: "IBM Plex Sans", sans-serif;
    min-height: 100vh;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  h1 {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-optical-sizing: auto;
    font-size: clamp(32px, 6vw, 48px);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 15px;
    margin: 0;
  }

  form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 32px;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 15px;
    padding: 10px 12px;
  }

  input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }

  button {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    border: 1px solid transparent;
    padding: 11px 18px;
    cursor: pointer;
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn-primary {
    background: var(--accent);
    color: #23180A;
    flex: 1;
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn-secondary {
    background: transparent;
    border-color: var(--border);
    color: var(--text-primary);
    white-space: nowrap;
  }

  .status {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 24px 0;
  }

  .status.error {
    color: var(--danger);
  }

  ul.results {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .result {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 10px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--border);
  }

  .result:last-child {
    border-bottom: none;
  }

  .result-name {
    flex-basis: 100%;
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--text-primary);
    text-decoration: none;
  }

  a.result-name {
    cursor: pointer;
  }

  a.result-name:hover,
  a.result-name:focus-visible {
    color: var(--accent);
    text-decoration: underline;
  }

  .leader {
    flex: 1;
    border-bottom: 1px dotted var(--border);
    height: 1px;
    min-width: 20px;
  }

  .result-score {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 500;
    font-size: 14px;
    color: var(--accent);
    white-space: nowrap;
  }

  .result-meta {
    flex-basis: 100%;
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 4px;
  }

  .result-meta .distance {
    color: var(--accent-2);
  }

  footer {
    text-align: center;
    margin-top: 40px;
    color: var(--text-muted);
    font-size: 12px;
  }

  @media (max-width: 480px) {
    .field-row { grid-template-columns: 1fr; }
    .result { flex-wrap: wrap; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .result { animation: fade-in 0.2s ease-out; }
  }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Restaurants4U</h1>
    <p class="subtitle">Find your table, ranked by rating and distance</p>
  </header>

  <form id="search-form">
    <div class="field-row">
      <div>
        <label for="lat">Latitude</label>
        <input type="number" id="lat" step="any" value="37.7749" required>
      </div>
      <div>
        <label for="lon">Longitude</label>
        <input type="number" id="lon" step="any" value="-122.4194" required>
      </div>
    </div>
    <div>
      <label for="category">Category (optional)</label>
      <input type="text" id="category" placeholder="e.g. Italian, Cafe, Mexican">
    </div>
    <div class="actions">
      <button type="submit" class="btn-primary" id="submit-btn">Find restaurants</button>
      <button type="button" class="btn-secondary" id="locate-btn">Use my location</button>
    </div>
  </form>

  <div id="status" class="status"></div>
  <ul id="results" class="results"></ul>

  <footer>Served by the Restaurants4U API &middot; scores from the trained model, distance from your location</footer>
</div>

<script>
  const form = document.getElementById('search-form');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const submitBtn = document.getElementById('submit-btn');
  const locateBtn = document.getElementById('locate-btn');

  function setStatus(text, isError) {
    statusEl.textContent = text || '';
    statusEl.classList.toggle('error', Boolean(isError));
  }

  function renderResults(results) {
    resultsEl.innerHTML = '';
    if (!results.length) {
      setStatus('No restaurants found nearby. Try a wider category or different coordinates.');
      return;
    }
    setStatus('');
    for (const r of results) {
      const li = document.createElement('li');
      li.className = 'result';
      const scorePct = Math.round(r.probability_highly_rated * 100);
      const name = r.title || r.restaurant_id;

      const nameEl = document.createElement(r.website_url ? 'a' : 'span');
      nameEl.className = 'result-name';
      nameEl.textContent = name;
      if (r.website_url) {
        nameEl.href = r.website_url;
        nameEl.target = '_blank';
        nameEl.rel = 'noopener noreferrer';
      }

      const leader = document.createElement('span');
      leader.className = 'leader';

      const scoreEl = document.createElement('span');
      scoreEl.className = 'result-score';
      scoreEl.textContent = `${scorePct}%`;

      const metaEl = document.createElement('span');
      metaEl.className = 'result-meta';
      metaEl.innerHTML = `<span class="distance">${r.distance_km.toFixed(2)} km</span> away`;

      li.append(nameEl, leader, scoreEl, metaEl);
      resultsEl.appendChild(li);
    }
  }

  async function fetchNearby(lat, lon, category) {
    submitBtn.disabled = true;
    setStatus('Looking for restaurants near you...');
    resultsEl.innerHTML = '';

    const params = new URLSearchParams({ lat, lon, top_k: 10 });
    if (category) params.set('category', category);

    try {
      const resp = await fetch(`/nearby?${params.toString()}`);
      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed (${resp.status})`);
      }
      const data = await resp.json();
      renderResults(data.results);
    } catch (err) {
      setStatus(err.message || 'Something went wrong. Is the API running?', true);
    } finally {
      submitBtn.disabled = false;
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const lat = document.getElementById('lat').value;
    const lon = document.getElementById('lon').value;
    const category = document.getElementById('category').value.trim();
    fetchNearby(lat, lon, category);
  });

  locateBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      setStatus('Geolocation is not supported in this browser.', true);
      return;
    }
    setStatus('Getting your location...');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        document.getElementById('lat').value = pos.coords.latitude.toFixed(6);
        document.getElementById('lon').value = pos.coords.longitude.toFixed(6);
        setStatus('');
      },
      () => setStatus('Could not get your location. Enter coordinates manually.', true)
    );
  });

  // Run an initial search on load with the default coordinates.
  fetchNearby(
    document.getElementById('lat').value,
    document.getElementById('lon').value,
    ''
  );
</script>
</body>
</html>
